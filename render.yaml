services:
  - type: web
    name: logicorp290
    env: node
    buildCommand: npm --prefix server install && npm --prefix client-panel install && npm --prefix client-panel run build
    startCommand: npm --prefix server start
    disk:
      name: logicorp-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: DATA_DIR
        value: /var/data
      - key: TEAMPAFEX_API_URL
        value: https://teampafex.in
      - key: TEAMPAFEX_EMAIL
        sync: false
      - key: TEAMPAFEX_PASSWORD
        sync: false
      - key: CORS_ORIGIN
        value: "*"
